# 1. deploy the skills alpha, beta (draft), gamma and delta to a file repository - not to the shared local repository
invoker.project.1 = producer
invoker.goals.1 = deploy -Dskill.push.skip=true -Dmaven.install.skip=true
# 2. deploy the project solo with the single skill solo-epsilon
invoker.project.2 = solo
invoker.goals.2 = deploy -Dskill.push.skip=true -Dmaven.install.skip=true
# 3. sync alpha, beta, solo-epsilon and delta - the execution is bound to initialize
invoker.project.3 = consumer
invoker.goals.3 = initialize
# 4. pull gamma without lock file
invoker.project.4 = consumer
invoker.goals.4 = oci-skills:pull -Dskill.artifact=de.eitco.cicd.it:cicd-skills:1.0.0:gamma
# 5. sync again - nothing changes and gamma is kept
invoker.project.5 = consumer
invoker.goals.5 = initialize
# 6. deploy version 1.1.0
invoker.project.6 = producer
invoker.goals.6 = deploy -Drevision=1.1.0 -Dskill.push.skip=true -Dmaven.install.skip=true
# 7. sync keeps the locked version 1.0.0
invoker.project.7 = consumer
invoker.goals.7 = initialize
# 8. update alpha to 1.1.0 - beta stays at the exact version 1.0.0, delta at the locked version 1.0.0
invoker.project.8 = consumer
invoker.goals.8 = oci-skills:update -Dskill=alpha
