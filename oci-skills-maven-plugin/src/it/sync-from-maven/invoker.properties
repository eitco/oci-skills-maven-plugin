# 1. deploy the skills alpha, beta (draft) and gamma to a file repository - not to the shared local repository
invoker.project.1 = producer
invoker.goals.1 = deploy -Dskill.push.skip=true -Dmaven.install.skip=true
# 2. sync alpha and beta - the execution is bound to initialize
invoker.project.2 = consumer
invoker.goals.2 = initialize
# 3. pull gamma without lock file
invoker.project.3 = consumer
invoker.goals.3 = oci-skills:pull -Dskill.artifact=de.eitco.cicd.it:cicd-skills:1.0.0:gamma
# 4. sync again - nothing changes and gamma is kept
invoker.project.4 = consumer
invoker.goals.4 = initialize
# 5. deploy version 1.1.0
invoker.project.5 = producer
invoker.goals.5 = deploy -Drevision=1.1.0 -Dskill.push.skip=true -Dmaven.install.skip=true
# 6. sync keeps the locked version 1.0.0
invoker.project.6 = consumer
invoker.goals.6 = initialize
# 7. update alpha to 1.1.0 - beta stays at the exact version 1.0.0
invoker.project.7 = consumer
invoker.goals.7 = oci-skills:update -Dskill=alpha
